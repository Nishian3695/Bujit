name: Release

# Triggers on any tag matching vX.Y.Z (e.g. v0.3.17), optionally followed by a
# "-<destination>" suffix that routes the release to an extra Play Store track
# (e.g. v0.3.17-closed1). See TRACK_MAP in the "Promote to target track" step
# below to add new destinations. No suffix = internal track only.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# contents:write is required to create the GitHub Release and attach the APK.
permissions:
  contents: write

# The Play Developer API only allows one open "edit" per package at a time, so two
# tags pushed close together (e.g. one for main, one for a feature branch) could race
# and fail with "the app has been modified since this edit began." This queues runs
# instead of letting them race -- cancel-in-progress stays false because these are
# real release uploads, never something to abort partway through.
concurrency:
  group: play-store-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Sign & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      # ── Secrets → files ────────────────────────────────────────────────────

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Write local.properties
        env:
          TELLER_APP_ID: ${{ secrets.TELLER_APP_ID }}
        run: printf 'TELLER_APP_ID=%s\n' "$TELLER_APP_ID" > local.properties

      # Decode the base64-encoded keystore into runner.temp (outside the Git
      # workspace to reduce any chance of it being captured in an artifact).
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"

      # ── Version ────────────────────────────────────────────────────────────

      # versionName  = tag without leading 'v' or trailing "-<destination>" (e.g. 0.3.21)
      # versionCode  = major*10000 + minor*1000 + patch  (e.g. v0.3.21 → 3021)
      #   Predictable, human-readable, and always increases with the tag.
      #   Max patch supported: 999. Max minor before overflow: 999.
      # trackSuffix  = whatever follows "-" in the tag (e.g. v0.3.21-closed1 → closed1),
      #   empty if the tag has no suffix. Looked up in TRACK_MAP below to decide where,
      #   beyond the internal track, this build gets promoted to.
      - name: Compute version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_FULL="${TAG#v}"
          VERSION="${VERSION_FULL%%-*}"
          SUFFIX="${VERSION_FULL#*-}"
          [ "$SUFFIX" = "$VERSION_FULL" ] && SUFFIX=""
          VERSION_CODE=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*1000 + $3}')
          echo "versionName=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE"  >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                   >> "$GITHUB_OUTPUT"
          echo "trackSuffix=$SUFFIX"        >> "$GITHUB_OUTPUT"
          echo "Release: $VERSION  (versionCode $VERSION_CODE)  suffix: '${SUFFIX:-<none>}'"

      # ── Build ──────────────────────────────────────────────────────────────

      # STORE_FILE, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD are read by the
      # signing config in build.gradle; they are injected as env vars, never
      # written to any tracked file.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release AAB (Play Store)
        env:
          STORE_FILE: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -PversionCode=${{ steps.version.outputs.versionCode }} \
            -PversionName=${{ steps.version.outputs.versionName }}

      - name: Build release APK (GitHub Releases / sideload)
        env:
          STORE_FILE: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ steps.version.outputs.versionCode }} \
            -PversionName=${{ steps.version.outputs.versionName }}

      # Wipe the decoded keystore immediately after signing; the job cleans
      # runner.temp on completion anyway, but this is defence-in-depth.
      - name: Shred keystore
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/release.jks" ]; then
            shred -u "${{ runner.temp }}/release.jks"
          fi

      # ── Publish ────────────────────────────────────────────────────────────

      # Creates a GitHub Release tagged with the pushed tag and attaches the
      # signed APK. Release notes are auto-generated from commits since the
      # last tag.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      # Uploads the signed AAB to the Play Store internal testing track.
      # Also ships the ProGuard mapping so stack traces deobfuscate in
      # Google Play's crash dashboard (Android Vitals).
      # Requires SERVICE_ACCOUNT_JSON — see docs/ci-setup.md for setup steps.
      - name: Upload AAB to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: io.github.nishian3695.bujit
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          whatsNewDirectory: play/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      # The AAB is already uploaded to Play Store by the internal-track step above.
      # Re-uploading the same file would fail with "version already in use" -- every
      # track below this point is promoted via edits().tracks().update() referencing
      # the versionCode already on internal, never a fresh file upload.
      #
      # Routes a release to zero or more extra tracks based on the tag's "-<suffix>"
      # (see the "Compute version" step). To add a new destination:
      #   1. Find its real Play Console track ID -- this is NOT the display name you
      #      gave the track in the console. Run locally with your service account JSON:
      #        edit = api.edits().insert(packageName=pkg, body={}).execute()
      #        print(api.edits().tracks().list(packageName=pkg, editId=edit['id']).execute())
      #        api.edits().delete(packageName=pkg, editId=edit['id']).execute()  # no changes made
      #   2. Add one line to TRACK_MAP below: 'yoursuffix': ['the_real_track_id'].
      #   3. Push a tag ending in -yoursuffix.
      # A suffix can map to multiple track IDs (all staged in one edit, one review).
      # An unrecognized suffix fails the job loudly rather than silently no-op'ing.
      - name: Promote to target track(s)
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ steps.version.outputs.versionCode }}
          TRACK_SUFFIX: ${{ steps.version.outputs.trackSuffix }}
        run: |
          pip3 install --quiet google-auth google-api-python-client
          python3 - << 'EOF'
          import os, json, sys
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          # ── Play Store track ID(s) here ──────────────
          TRACK_MAP = {
              '':          [],                    # no suffix is internal only, nothing further
              'closedalpha':   ['alpha'],             # default closed track
              'closedbeta':   ['closed_0.1.0'],      # custom closed track
              'closed': ['alpha', 'closed_0.1.0'],  # every closed track at once
              'open':      ['beta'],              # only open testing track Play Console allows
          }
          # ───────────────────────────────────────────────────────────────────

          suffix = os.environ['TRACK_SUFFIX']
          if suffix not in TRACK_MAP:
              sys.exit(
                  f"Unknown tag suffix '{suffix}'. Known suffixes: "
                  f"{sorted(k for k in TRACK_MAP if k)}. "
                  f"Add it to TRACK_MAP in release.yml to use it."
              )
          tracks = TRACK_MAP[suffix]
          if not tracks:
              print('No extra track for this tag -- release stays on internal.')
              sys.exit(0)

          sa    = json.loads(os.environ['SERVICE_ACCOUNT_JSON'])
          creds = Credentials.from_service_account_info(
              sa, scopes=['https://www.googleapis.com/auth/androidpublisher'])
          api   = build('androidpublisher', 'v3', credentials=creds, cache_discovery=False)
          pkg   = 'io.github.nishian3695.bujit'
          vc    = int(os.environ['VERSION_CODE'])
          release_body = {'releases': [{'versionCodes': [str(vc)], 'status': 'completed'}]}

          edit = api.edits().insert(packageName=pkg, body={}).execute()
          eid  = edit['id']
          for track in tracks:
              api.edits().tracks().update(
                  packageName=pkg, editId=eid, track=track, body=release_body
              ).execute()
              print(f'Staged versionCode {vc} → {track}')
          api.edits().commit(packageName=pkg, editId=eid).execute()
          print(f'Committed — single review covers: {", ".join(tracks)}')
          EOF
