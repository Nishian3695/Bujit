name: iOS Release (TestFlight)

# Builds a signed iOS release on a GitHub-hosted Mac and uploads it to App Store
# Connect, where it appears in TestFlight (and can be submitted for review). Push
# a tag like ios-v1.0.0 (or run it from Actions with a version). Not runnable until
# the Apple developer account steps in SETUP_TODO.md are done.
#
# Signing is Xcode's automatic (cloud) signing with an App Store Connect API key,
# so no certificates or profiles are stored here.
#
# Repository secrets:
#   APPSTORE_API_KEY_ID      the key's ID (App Store Connect > Users and Access >
#                            Integrations > App Store Connect API; Admin role)
#   APPSTORE_API_ISSUER_ID   the Issuer ID shown on that page
#   APPSTORE_API_KEY_P8      the contents of the downloaded AuthKey_XXXX.p8
#   APPLE_TEAM_ID            optional; defaults to Bujit's Team ID, QY53K7TM87
#
# Version: as on Android, the tag without "ios-v" is the version name and
# major*10000 + minor*1000 + patch the build number (ios-v1.0.3 -> 1.0.3 (10003)).
on:
  push:
    tags:
      - 'ios-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: app-store-upload
  cancel-in-progress: false

jobs:
  testflight:
    name: Build, sign & upload to TestFlight
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Compute version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#ios-v}}"
          BUILD=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*1000 + $3}')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=$BUILD" >> "$GITHUB_OUTPUT"
          echo "iOS release $VERSION ($BUILD)"

      # Outside the workspace, so it can't end up in an artifact.
      - name: Write the API key
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: printf '%s' "$APPSTORE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey_$APPSTORE_API_KEY_ID.p8"

      # Builds the Flutter side and installs the CocoaPods; Xcode signs below.
      - name: Build (unsigned)
        run: >
          flutter build ios --release --no-codesign
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}

      # Archived unsigned: Xcode's automatic signing archives with a development
      # profile, which needs a registered iPhone, and Bujit's team has none. The
      # export below signs everything for distribution (App Store), which needs no
      # devices. So the entitlements (bank-login links, App Attest) survive into
      # that signature, they're put in here with a local signature, which needs no
      # profile.
      - name: Archive (unsigned)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'QY53K7TM87' }}
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          APP="$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app"
          sed -e "s/\$(AppIdentifierPrefix)/$TEAM_ID./g" -e "s/\$(TeamIdentifierPrefix)/$TEAM_ID./g" \
            ios/Runner/Runner.entitlements > "$RUNNER_TEMP/Runner.entitlements"
          find "$APP/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) \
            -exec codesign --force --sign - {} \; 2>/dev/null || true
          codesign --force --sign - --entitlements "$RUNNER_TEMP/Runner.entitlements" "$APP"

      - name: Export (signed for the App Store)
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'QY53K7TM87' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee -a "$RUNNER_TEMP/xcodebuild.log"

      # The signed app must still have its entitlements; otherwise bank logins and
      # App Check would break on iPhone, so nothing is uploaded.
      - name: Check the entitlements
        run: |
          cd "$RUNNER_TEMP/export" && unzip -q -o ./*.ipa -d ipa
          codesign -d --entitlements - --xml ipa/Payload/Runner.app > "$RUNNER_TEMP/ent.plist" 2>/dev/null
          ENT=$(plutil -convert json -o - "$RUNNER_TEMP/ent.plist")
          echo "::notice::Signed entitlements: $ENT"
          for key in com.apple.developer.associated-domains com.apple.developer.devicecheck.appattest-environment; do
            echo "$ENT" | grep -q "$key" || { echo "::error::The signed app is missing $key"; exit 1; }
          done

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          cp "$RUNNER_TEMP/AuthKey_$KEY_ID.p8" "$RUNNER_TEMP/private_keys/"
          cd "$RUNNER_TEMP"
          set -o pipefail
          xcrun altool --upload-app --type ios --file export/*.ipa \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" 2>&1 | tee -a "$RUNNER_TEMP/xcodebuild.log"
          echo "Uploaded ${{ steps.version.outputs.name }} (${{ steps.version.outputs.number }}). It appears in TestFlight after Apple's processing (usually minutes)." >> "$GITHUB_STEP_SUMMARY"

      # Xcode's own error lines as annotations, readable on the run's page (and
      # through the API) without opening the full log.
      - name: Show Xcode's errors
        if: failure()
        run: |
          grep -E "error:|ERROR|No profiles|Provisioning profile|requires a provisioning|Signing for" \
            "$RUNNER_TEMP/xcodebuild.log" 2>/dev/null | sort -u | head -10 | while IFS= read -r line; do
            echo "::error::${line:0:900}"
          done

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/private_keys"
