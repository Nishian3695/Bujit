plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// ── Signing ────────────────────────────────────────────────────────────────────
// In CI:    STORE_FILE / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD env vars
//           are injected by the release workflow — never written to disk.
// Locally:  copy keystore.properties.example → keystore.properties (gitignored)
//           and fill in your keystore path + credentials.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def storeFilePath = System.getenv('STORE_FILE') ?: keystoreProps.getProperty('storeFile')
def isSigning = storeFilePath != null && !storeFilePath.isEmpty()

android {
    compileSdk 36

    defaultConfig {
        applicationId "io.github.nishian3695.bujit"
        minSdk 26
        targetSdk 36

        // versionCode: defaults to the value below; overridden by -PversionCode in CI
        // (CI uses total commit count so it always increases without manual bumps).
        versionCode  project.hasProperty('versionCode')  ? project.versionCode.toInteger()  : 24
        versionName  project.hasProperty('versionName')  ? project.versionName              : "0.3.16"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def localProps = new Properties()
        def localPropsFile = rootProject.file('local.properties')
        if (localPropsFile.exists()) localProps.load(new FileInputStream(localPropsFile))
        buildConfigField "String", "TELLER_APP_ID", "\"${localProps.getProperty('TELLER_APP_ID', '')}\""
    }

    if (isSigning) {
        signingConfigs {
            release {
                storeFile     file(storeFilePath)
                storePassword System.getenv('STORE_PASSWORD') ?: keystoreProps.getProperty('storePassword', '')
                keyAlias      System.getenv('KEY_ALIAS')      ?: keystoreProps.getProperty('keyAlias', '')
                keyPassword   System.getenv('KEY_PASSWORD')   ?: keystoreProps.getProperty('keyPassword', '')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (isSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            testCoverageEnabled = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        // Snapshot of pre-existing issues; only NEW issues introduced after this
        // baseline was created will fail the build. Generate/update with:
        //   ./gradlew updateLintBaseline
        baseline = file("lint-baseline.xml")
        // Still treat errors as errors (not downgraded to warnings).
        abortOnError true
    }
    buildFeatures {
        buildConfig true
    }
    namespace 'io.github.nishian3695.bujit'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation('io.teller:connect-android-sdk:0.1.0')
    implementation 'com.plaid.link:sdk-core:4.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.fragment:fragment:1.7.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.android.play:integrity:1.6.0'
    implementation platform('com.google.firebase:firebase-bom:34.15.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'
    implementation 'com.android.billingclient:billing:7.1.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
